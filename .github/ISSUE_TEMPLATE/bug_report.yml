name: Something doesn't work
description: A wrong translation, a menu read badly, a crash, a button that does nothing.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you pointed the camera at, what you did, and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: picture
    attributes:
      label: Photo or screen recording
      description: >
        A photo of the menu or sign, or a screen recording, helps more than anything else. Only
        attach what you're happy to make public, and keep other people's faces out of it.
  - type: input
    id: build
    attributes:
      label: Traduci build
      description: In TestFlight, under the app's name (e.g. 11.1). Or the commit, if you built it from Xcode.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: iPhone and iOS version
      placeholder: iPhone 18 Pro, iOS 27.0
    validations:
      required: true
