name: TestFlight

# Builds, signs (Apple cloud signing, no certificates to manage) and uploads to TestFlight.
# Setup: README.md → "Install with TestFlight".
on:
  workflow_dispatch: # the Run button shows up once this file is on main
  push: # every change to the app ships a build
    branches: [main, claude/iphone-camera-translation-italian-ddayx8]
    paths: ["Traduci/**", "Traduci.xcodeproj/**", ".github/workflows/testflight.yml"]

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.twidtwid.Traduci' }}
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

jobs:
  preflight:
    name: Check Apple setup
    if: ${{ !contains(github.event.head_commit.message, '[lab]') }} # lab iterations don't ship
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check secrets
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            [ -n "${!name}" ] || { echo "::error::Repository secret $name is not set"; missing=1; }
          done
          [ -n "$TEAM_ID" ] || { echo "::error::Repository secret APPLE_TEAM_ID is not set"; missing=1; }
          exit $missing

      - name: Install API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Register bundle ID and find the app record
        env:
          KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet -r scripts/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" scripts/asc_preflight.py

  upload:
    name: Build and upload
    needs: preflight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Core logic tests # never ship a build that fails them
        run: |
          xcrun swiftc -O Traduci/Core/*.swift Tests/CoreTests/main.swift -o "$RUNNER_TEMP/core-tests"
          "$RUNNER_TEMP/core-tests"

      # Archive unsigned: a signed archive would mint a new development certificate on every
      # fresh runner. Signing happens at export with Apple's cloud-managed distribution certificate.
      - name: Archive
        run: |
          xcodebuild -version
          xcodebuild archive \
            -project Traduci.xcodeproj \
            -scheme Traduci \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Traduci.xcarchive" \
            -quiet \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Sign and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Traduci.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Uploaded build $BUILD_NUMBER. Apple takes 5 to 15 minutes to process it, then it shows up in TestFlight."

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"
