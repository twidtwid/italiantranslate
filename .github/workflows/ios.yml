name: iOS build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: "26"
            experimental: false
          - runner: xcode-27 # public-preview image with the iOS 27 SDK
            xcode: "27"
            experimental: true
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: xcodebuild -version

      - name: Core logic tests
        run: |
          xcrun swiftc -O Traduci/Core/*.swift Tests/CoreTests/main.swift -o "$RUNNER_TEMP/core-tests"
          "$RUNNER_TEMP/core-tests"

      - name: Build app (unsigned Release)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Traduci.xcodeproj \
            -scheme Traduci \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log"
